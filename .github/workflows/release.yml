name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Created if it doesn't exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
        working-directory: ui
      - run: make ui
      - run: go test ./internal/... -count=1
      - name: Build release binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/flightdeck-linux-amd64 ./cmd/flightdeck
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/flightdeck-linux-arm64 ./cmd/flightdeck
      - name: Generate checksums
        run: cd dist && sha256sum flightdeck-linux-* > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/flightdeck-linux-amd64
            dist/flightdeck-linux-arm64
            dist/checksums.txt
          generate_release_notes: true
